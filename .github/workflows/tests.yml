# The backend tests (in the image that will be shipped) and the web app's type-check and build: on every pull
# request, and as the first step of every release (release.yml calls this workflow), so a pull request is tested
# exactly as its release will be.
name: tests

on:
  pull_request:
  workflow_call:

# A new push to a pull request replaces its running tests; a release's are never cancelled.
concurrency:
  group: tests-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  packages: read

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
        with:
          # BuildKit itself from Google's Docker Hub mirror, as the images: Docker Hub refuses or times out the
          # shared runners' anonymous pulls.
          driver-opts: image=mirror.gcr.io/moby/buildkit:buildx-stable-1
      # The database the tests run against is the database image this commit would publish (deploy/postgres:
      # PostgreSQL 16 with pgvector and PostGIS), built here rather than pulled: a published `latest` that turned
      # out broken would otherwise fail every test run, including the release meant to replace it.
      - uses: docker/build-push-action@v6
        with:
          context: deploy/postgres
          load: true
          tags: argus-postgres:ci
          cache-from: type=gha,scope=postgres
          cache-to: type=gha,mode=max,scope=postgres
      - name: Start the database
        run: |
          docker run -d --name postgres -p 5432:5432 \
            -e POSTGRES_USER=postgres -e POSTGRES_PASSWORD=postgres -e POSTGRES_DB=app argus-postgres:ci
          for i in $(seq 1 60); do docker exec postgres pg_isready -U postgres -q && exit 0; sleep 2; done
          docker logs postgres; exit 1
      # The tests run in the image that will be shipped, with its system tools (dwg2dxf, fonts, git).
      - uses: docker/build-push-action@v6
        with:
          context: backend
          load: true
          tags: argus-backend:ci
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend
      - name: Run the backend tests
        run: |
          docker run --rm --network host \
            -e DATABASE_URL=postgresql://postgres:postgres@localhost:5432/app \
            -e TOKEN_PEPPER=ci-only \
            -v "$PWD/backend/tests:/app/tests:ro" \
            -v "$PWD/backend/openapi:/app/openapi:ro" \
            -v "$PWD/tools:/app/tools:ro" \
            -v "$PWD/docs:/docs:ro" \
            -v "$PWD/backend/requirements-dev.txt:/app/requirements-dev.txt:ro" \
            argus-backend:ci sh -c "pip install -q -r requirements-dev.txt && \
              export IMPORT_SECRETS_KEY=\$(python -c 'from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())') && \
              python -m pytest -q -p no:cacheprovider tests \
              --deselect tests/test_readiness_ops.py::test_a_backup_restores_into_a_scratch_database_and_checks_itself"

  web-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: webapp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: webapp/package-lock.json
      - run: npm ci
      # Type-checks and builds, as the image does.
      - run: npm run build
