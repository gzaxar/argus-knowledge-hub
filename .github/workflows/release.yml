# A version tag (v1.33.0) is a release: the tests run, the two images are built and pushed to ghcr.io
# with that version and `latest`, and the chart's production values on main are set to the version, which
# is what Argo CD (k8s/argocd/application.yaml) rolls out. A failing test stops it before anything is pushed.
name: release

on:
  push:
    tags: ["v*.*.*"]

concurrency:
  group: release
  cancel-in-progress: false

env:
  BACKEND_IMAGE: ghcr.io/infn-argus/argus-knowledge-hub-backend
  WEB_IMAGE: ghcr.io/infn-argus/argus-knowledge-hub-web
  POSTGRES_IMAGE: ghcr.io/infn-argus/argus-knowledge-hub-postgres
  VALUES: charts/argus-knowledge-hub/values-production.yaml
  # Built into the web app (Vite): where the browser signs in and finds the API in production.
  WEB_KEYCLOAK: https://keycloak.90.147.174.30.myip.cloud.infn.it/realms/argus
  WEB_API: https://argus-hub-api.90.147.174.30.myip.cloud.infn.it

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read          # the database image (ghcr.io) for the test service
    services:
      postgres:
        # As in docker-compose.yml: Ask ARGUS's search needs pgvector. From Google's Docker Hub mirror: Docker
        # Hub limits anonymous pulls by address, and the shared runners hit it.
        # With PostGIS too (the spatial model): the database image every release publishes (deploy/postgres),
        # which production runs since the switch rehearsed with tools/db-image-rehearsal.
        image: ghcr.io/infn-argus/argus-knowledge-hub-postgres:latest
        credentials:   # a new GitHub package is private: the workflow's own token reads it
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: app
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
        with:
          # BuildKit itself from Google's Docker Hub mirror, as the images: Docker Hub refuses or times out the
          # shared runners' anonymous pulls.
          driver-opts: image=mirror.gcr.io/moby/buildkit:buildx-stable-1
      # The tests run in the image that will be shipped, with its system tools (dwg2dxf, fonts, git).
      - uses: docker/build-push-action@v6
        with:
          context: backend
          load: true
          tags: argus-backend:ci
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend
      - name: Run the backend tests
        run: |
          docker run --rm --network host \
            -e DATABASE_URL=postgresql://postgres:postgres@localhost:5432/app \
            -e TOKEN_PEPPER=ci-only \
            -v "$PWD/backend/tests:/app/tests:ro" \
            -v "$PWD/backend/openapi:/app/openapi:ro" \
            -v "$PWD/tools:/app/tools:ro" \
            -v "$PWD/backend/requirements-dev.txt:/app/requirements-dev.txt:ro" \
            argus-backend:ci sh -c "pip install -q -r requirements-dev.txt && \
              export IMPORT_SECRETS_KEY=\$(python -c 'from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())') && \
              python -m pytest -q -p no:cacheprovider tests \
              --deselect tests/test_readiness_ops.py::test_a_backup_restores_into_a_scratch_database_and_checks_itself"

  web-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: webapp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: webapp/package-lock.json
      - run: npm ci
      # Type-checks and builds, as the image does.
      - run: npm run build

  publish:
    needs: [backend-tests, web-build]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: version
        run: |
          echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          echo "commit=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          echo "built_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
        with:
          # BuildKit itself from Google's Docker Hub mirror, as the images: Docker Hub refuses or times out the
          # shared runners' anonymous pulls.
          driver-opts: image=mirror.gcr.io/moby/buildkit:buildx-stable-1
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: backend
          push: true
          build-args: |
            ARGUS_VERSION=${{ steps.version.outputs.version }}
            ARGUS_COMMIT=${{ steps.version.outputs.commit }}
            ARGUS_BUILT_AT=${{ steps.version.outputs.built_at }}
          tags: ${{ env.BACKEND_IMAGE }}:${{ steps.version.outputs.version }},${{ env.BACKEND_IMAGE }}:latest
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend
      - uses: docker/build-push-action@v6
        with:
          context: webapp
          push: true
          build-args: |
            VITE_OIDC_AUTHORITY=${{ env.WEB_KEYCLOAK }}
            VITE_OIDC_CLIENT_ID=argus-webapp
            VITE_OIDC_LABEL=Keycloak login
            VITE_API_BASE_URL=${{ env.WEB_API }}
            VITE_APP_VERSION=${{ steps.version.outputs.version }}
            VITE_APP_COMMIT=${{ steps.version.outputs.commit }}
            VITE_APP_BUILT_AT=${{ steps.version.outputs.built_at }}
          tags: ${{ env.WEB_IMAGE }}:${{ steps.version.outputs.version }},${{ env.WEB_IMAGE }}:latest
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web
      # The database image with PostGIS beside pgvector (deploy/postgres). Built with every release, so the
      # one to rehearse and switch to is always at hand; production keeps its image until values.yaml says
      # otherwise, after tools/db-image-rehearsal has passed on its data (docs/operations.md).
      - uses: docker/build-push-action@v6
        with:
          context: deploy/postgres
          push: true
          tags: ${{ env.POSTGRES_IMAGE }}:${{ steps.version.outputs.version }},${{ env.POSTGRES_IMAGE }}:latest
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha,scope=postgres
          cache-to: type=gha,mode=max,scope=postgres

  # The deployment itself: Argo CD follows the chart's production values on main.
  deploy:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Point the manifests at ${{ needs.publish.outputs.version }}
        env:
          VERSION: ${{ needs.publish.outputs.version }}
        run: |
          sed -i -E "s/^(    tag: ).*/\1\"${VERSION}\"/" "$VALUES"
          grep -q "tag: \"${VERSION}\"" "$VALUES"
          git diff --quiet && { echo "already at ${VERSION}"; exit 0; }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "Deploy ${VERSION}"
          for attempt in 1 2 3; do git pull --rebase origin main && git push origin HEAD:main && exit 0; sleep 5; done
          exit 1
