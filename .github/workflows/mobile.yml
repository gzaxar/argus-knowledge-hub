# The field app's Android build. A version tag builds the release APK against production — the same tag
# release.yml deploys the server with, so the app and the API it talks to are released together — and
# attaches it to that tag's GitHub release; "Run workflow" builds one on demand. The tests run first.
#
# Signing: with the ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS and
# ANDROID_KEY_PASSWORD secrets set, the APK is signed with that upload key (read by
# android/app/build.gradle.kts from ANDROID_KEYSTORE_PATH and the others). Without them it is signed with
# the runner's throwaway debug key: installable, but a phone can only update it with an APK signed by the
# same key, so each such build has to replace the app (uninstall first) rather than update it.
#
# Two builds of the same version come out of it. The APK on the GitHub release (ARGUS_DISTRIBUTION=github)
# checks GitHub for a newer release and offers to download it. The app bundle (ARGUS_DISTRIBUTION=play)
# goes to Google Play's internal testing track when the PLAY_SERVICE_ACCOUNT_JSON secret is set; Play updates
# it, so it never checks GitHub. Play re-signs what it delivers with its own app signing key, so a phone with
# the GitHub APK cannot update to the Play build (or back) without uninstalling first: pick one per phone.
# A new Play app accepts only draft releases, finished by hand in the Console; once it has been through
# that, set the repository variable PLAY_RELEASE_STATUS to "completed" so a tag reaches testers by itself.
name: mobile

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

concurrency:
  group: mobile-${{ github.ref }}
  cancel-in-progress: false

env:
  FLUTTER_VERSION: 3.47.5
  # As the launch configurations build it today. "production" hides the developer-token sign-in.
  ARGUS_ENV: development
  ARGUS_API_BASE: https://argus-hub-api.90.147.174.30.myip.cloud.infn.it
  OIDC_ISSUER: https://keycloak.90.147.174.30.myip.cloud.infn.it/realms/argus
  ARGUS_LINK_HOST: argus-hub.90.147.174.30.myip.cloud.infn.it

jobs:
  apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: mobile/app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter test
      - name: Version
        id: version
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            name="${GITHUB_REF_NAME#v}"
          else
            name="$(sed -n 's/^version: *\([^+]*\).*/\1/p' pubspec.yaml)"
          fi
          # A tag's code comes from its version (1.35.25 -> 1035025), so every release is above the one before
          # and above anything uploaded to Google Play by hand; other builds stay above the 1 a local build uses.
          echo "name=$name" >> "$GITHUB_OUTPUT"
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            IFS=. read -r major minor patch <<< "${name%%-*}"
            echo "code=$((10#$major * 1000000 + 10#$minor * 1000 + 10#${patch:-0}))" >> "$GITHUB_OUTPUT"
          else
            echo "code=$((1000 + GITHUB_RUN_NUMBER))" >> "$GITHUB_OUTPUT"
          fi
      - name: Upload key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/upload.jks"
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::No ANDROID_KEYSTORE_BASE64 secret: this APK is signed with a throwaway debug key."
          fi
      - name: Build
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          # The host of the app links and QR labels the manifest claims (-PargusLinkHost).
          ORG_GRADLE_PROJECT_argusLinkHost: ${{ env.ARGUS_LINK_HOST }}
        run: |
          flutter build apk --release \
            --build-name="${{ steps.version.outputs.name }}" \
            --build-number="${{ steps.version.outputs.code }}" \
            --dart-define=ARGUS_ENV="$ARGUS_ENV" \
            --dart-define=ARGUS_API_BASE="$ARGUS_API_BASE" \
            --dart-define=OIDC_ISSUER="$OIDC_ISSUER" \
            --dart-define=ARGUS_LINK_HOST="$ARGUS_LINK_HOST" \
            --dart-define=ARGUS_APP_VERSION="${{ steps.version.outputs.name }}" \
            --dart-define=ARGUS_DISTRIBUTION=github
          mv build/app/outputs/flutter-apk/app-release.apk "build/argus-field-${{ steps.version.outputs.name }}.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: argus-field-${{ steps.version.outputs.name }}
          path: mobile/app/build/argus-field-${{ steps.version.outputs.name }}.apk
      - name: Attach to the release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || \
            gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes "ARGUS $GITHUB_REF_NAME"
          gh release upload "$GITHUB_REF_NAME" "build/argus-field-${{ steps.version.outputs.name }}.apk" --clobber
      - name: Build the app bundle for Google Play
        if: github.ref_type == 'tag'
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ORG_GRADLE_PROJECT_argusLinkHost: ${{ env.ARGUS_LINK_HOST }}
        run: |
          flutter build appbundle --release \
            --build-name="${{ steps.version.outputs.name }}" \
            --build-number="${{ steps.version.outputs.code }}" \
            --dart-define=ARGUS_ENV="$ARGUS_ENV" \
            --dart-define=ARGUS_API_BASE="$ARGUS_API_BASE" \
            --dart-define=OIDC_ISSUER="$OIDC_ISSUER" \
            --dart-define=ARGUS_LINK_HOST="$ARGUS_LINK_HOST" \
            --dart-define=ARGUS_APP_VERSION="${{ steps.version.outputs.name }}" \
            --dart-define=ARGUS_DISTRIBUTION=play
          mv build/app/outputs/bundle/release/app-release.aab "build/argus-field-${{ steps.version.outputs.name }}.aab"
      - uses: actions/upload-artifact@v4
        if: github.ref_type == 'tag'
        with:
          name: argus-field-${{ steps.version.outputs.name }}-play
          path: mobile/app/build/argus-field-${{ steps.version.outputs.name }}.aab
      - name: Is Google Play set up
        id: play
        if: github.ref_type == 'tag'
        env:
          PLAY_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -n "$PLAY_JSON" ] && [ -n "$ANDROID_KEYSTORE_PATH" ]; then
            echo "upload=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::No PLAY_SERVICE_ACCOUNT_JSON secret (or no upload key): the bundle is not sent to Google Play."
          fi
      - name: Send to Google Play internal testing
        if: steps.play.outputs.upload == 'true'
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: it.infn.argus.field
          releaseFiles: mobile/app/build/argus-field-${{ steps.version.outputs.name }}.aab
          releaseName: ${{ steps.version.outputs.name }}
          track: internal
          status: ${{ vars.PLAY_RELEASE_STATUS || 'draft' }}
