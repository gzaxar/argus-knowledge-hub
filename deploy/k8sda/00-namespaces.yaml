# ARGUS on k8sda (docs/k8sda.md): its own namespace, held to Pod Security "restricted", and the public ingress
# controller's, the only thing the internet reaches.
apiVersion: v1
kind: Namespace
metadata:
  name: argus-hub
  labels:
    app.kubernetes.io/part-of: argus-knowledge-hub
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: latest
    pod-security.kubernetes.io/warn: restricted
---
apiVersion: v1
kind: Namespace
metadata:
  name: ingress-public
  labels:
    app.kubernetes.io/part-of: argus-knowledge-hub
    # The controller binds ports 80 and 443 (NET_BIND_SERVICE): baseline enforced, restricted warned.
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/enforce-version: latest
    pod-security.kubernetes.io/warn: restricted
