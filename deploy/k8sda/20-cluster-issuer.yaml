# Let's Encrypt through the public controller: the HTTP-01 check reaches it, not the cluster's shared nginx.
# Works once the hosts' public DNS names point to the public address (docs/k8sda.md).
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-public
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: andrea.michelotti@lnf.infn.it
    privateKeySecretRef: {name: letsencrypt-public-account}
    solvers:
      - http01:
          ingress:
            ingressClassName: nginx-public
