{{- if .Values.quota.enabled }}
# What the namespace may take of the shared cluster: a flood of requests from the internet slows ARGUS, not its
# neighbours.
apiVersion: v1
kind: ResourceQuota
metadata:
  name: argus-quota
  labels: {{- include "argus.labels" . | nindent 4 }}
spec:
  hard: {{- toYaml .Values.quota.hard | nindent 4 }}
---
apiVersion: v1
kind: LimitRange
metadata:
  name: argus-limits
  labels: {{- include "argus.labels" . | nindent 4 }}
spec:
  limits:
    - type: Container
      default: {{- toYaml .Values.quota.containerDefault | nindent 8 }}
      defaultRequest: {{- toYaml .Values.quota.containerDefaultRequest | nindent 8 }}
{{- end }}
