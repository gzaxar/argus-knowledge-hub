{{- $root := . -}}
{{- $jobs := list -}}
{{- if .Values.portabilityJobs.cleanup.enabled -}}
{{- $jobs = append $jobs (dict "name" "argus-portability-cleanup" "schedule" .Values.portabilityJobs.cleanup.schedule
      "suspend" false "command" (list "python" "-m" "app.portability" "cleanup") "deadline" 3600 "active" 0) -}}
{{- end -}}
{{- if .Values.portabilityJobs.scheduled.enabled -}}
{{- $jobs = append $jobs (dict "name" "argus-portability-scheduled" "schedule" .Values.portabilityJobs.scheduled.schedule
      "suspend" false "command" (list "python" "-m" "app.portability" "scheduled") "deadline" 600 "active" 21600) -}}
{{- end -}}
{{- if .Values.portabilityJobs.restoreDrill.enabled -}}
{{- $jobs = append $jobs (dict "name" "argus-portability-restore-drill" "schedule" .Values.portabilityJobs.restoreDrill.schedule
      "suspend" .Values.portabilityJobs.restoreDrill.suspend
      "command" (list "python" "-m" "app.portability" "drill" "--repository" .Values.portabilityJobs.restoreDrill.repository "--by" "restore-drill-cronjob")
      "deadline" 86400 "active" 21600) -}}
{{- end -}}
{{- range $jobs }}
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ .name }}
  labels: {{- include "argus.labels" $root | nindent 4 }}
spec:
  schedule: {{ .schedule | quote }}
  suspend: {{ .suspend }}
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: {{ .deadline }}
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 0
      {{- if .active }}
      activeDeadlineSeconds: {{ .active }}
      {{- end }}
      template:
        metadata:
          labels: {app: {{ .name }}}
        spec:
          restartPolicy: Never
          # Its volumes are the API's, ReadWriteOnce on that node's disk.
          affinity:
            podAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                - labelSelector: {matchLabels: {app: argus-api}}
                  topologyKey: kubernetes.io/hostname
          containers:
            - name: job
              image: "{{ $root.Values.images.backend.repository }}:{{ $root.Values.images.backend.tag }}"
              command: {{ toJson .command }}
              env:
                {{- include "argus.apiEnv" $root | nindent 16 }}
              resources:
                requests: {cpu: 50m, memory: 256Mi}
                limits: {memory: 2Gi}
              volumeMounts:
                - {name: portability, mountPath: /data/portability}
                - {name: portability-secret, mountPath: /etc/argus/portability, readOnly: true}
          volumes:
            - name: portability
              persistentVolumeClaim: {claimName: argus-portability}
            - name: portability-secret
              secret:
                secretName: {{ $root.Values.portabilitySecret }}
                defaultMode: 0400
                optional: true
{{- end }}
