# The web app's sign-in and API addresses are built into its image (VITE_* build arguments in
# .github/workflows/release.yml); web.runtimeConfig overrides them for this installation (config.js, read
# before the app starts), so one image serves every installation.
{{- with .Values.web.runtimeConfig }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: argus-web-config
  labels: {{- include "argus.labels" $ | nindent 4 }}
data:
  config.js: |
    window.__ARGUS_CONFIG__ = {{ toJson . }};
---
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: argus-web
  labels: {{- include "argus.labels" . | nindent 4 }}
    app: argus-web
spec:
  replicas: 1
  selector:
    matchLabels: {app: argus-web}
  template:
    metadata:
      labels: {app: argus-web}
      {{- with .Values.web.runtimeConfig }}
      annotations:
        checksum/config: {{ toJson . | sha256sum }}
      {{- end }}
    spec:
      {{- include "argus.podSecurity" (dict "root" . "user" 101) | nindent 6 }}
      {{- with .Values.web.nodeSelector }}
      nodeSelector: {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: web
          image: "{{ .Values.images.web.repository }}:{{ .Values.images.web.tag }}"
          ports: [{containerPort: 8080}]
          {{- include "argus.containerSecurity" (dict "root" . "readOnly" true) | nindent 10 }}
          readinessProbe:
            httpGet: {path: /, port: 8080}
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /, port: 8080}
            initialDelaySeconds: 10
            periodSeconds: 20
          resources: {{- toYaml .Values.web.resources | nindent 12 }}
          {{- if or .Values.web.runtimeConfig .Values.security.hardened }}
          volumeMounts:
            {{- if .Values.web.runtimeConfig }}
            - {name: config, mountPath: /usr/share/nginx/html/config.js, subPath: config.js, readOnly: true}
            {{- end }}
            {{- if .Values.security.hardened }}
            # A read-only image: nginx writes only its cache, its pid and temporary files.
            - {name: cache, mountPath: /var/cache/nginx}
            - {name: run, mountPath: /var/run}
            - {name: tmp, mountPath: /tmp}
            {{- end }}
          {{- end }}
      {{- if or .Values.web.runtimeConfig .Values.security.hardened }}
      volumes:
        {{- if .Values.web.runtimeConfig }}
        - name: config
          configMap: {name: argus-web-config}
        {{- end }}
        {{- if .Values.security.hardened }}
        - {name: cache, emptyDir: {}}
        - {name: run, emptyDir: {medium: Memory, sizeLimit: 1Mi}}
        - {name: tmp, emptyDir: {sizeLimit: 64Mi}}
        {{- end }}
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: argus-web
  labels: {{- include "argus.labels" . | nindent 4 }}
spec:
  selector: {app: argus-web}
  ports: [{port: 80, targetPort: 8080}]
