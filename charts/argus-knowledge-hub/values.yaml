# Defaults; a deployment's own values (values-production.yaml) say where and how big.

# Created by hand, never in Git (README.md): postgres-password, database-url, token-pepper,
# import-secrets-key, keycloak-admin-password; keycloak-google-client-secret when keycloak.google is set.
existingSecret: argus-secrets

hosts:
  web: assets.example.org
  api: assets-api.example.org
  keycloak: keycloak.example.org

ingress:
  className: nginx
  clusterIssuer: letsencrypt-prod-issuer

images:
  backend:
    repository: ghcr.io/infn-argus/argus-knowledge-hub-backend
    tag: "1.33.0"
  web:
    repository: ghcr.io/infn-argus/argus-knowledge-hub-web
    tag: "1.33.0"
  postgres: pgvector/pgvector:pg16-trixie
  keycloak: quay.io/keycloak/keycloak:24.0.5

storageClass: local-path

postgres:
  database: argus
  user: argus
  size: 10Gi
  nodeSelector: {}
  resources:
    requests: {cpu: 100m, memory: 256Mi}
    limits: {memory: 1Gi}

api:
  attachmentsSize: 15Gi
  portabilitySize: 5Gi
  nodeSelector: {}
  # Sign-in providers besides Keycloak, as the API's OIDC_EXTRA_PROVIDERS entries: {issuer, jwks_uri, audience}.
  extraProviders: []
  # More environment, e.g. the portability settings (docs/operations.md, "Configuration").
  env: {}
  resources:
    requests: {cpu: 100m, memory: 256Mi}
    limits: {memory: 1Gi}

web:
  nodeSelector: {}
  resources:
    requests: {cpu: 20m, memory: 32Mi}
    limits: {memory: 128Mi}

keycloak:
  enabled: true
  realm: argus
  clientId: argus-webapp
  adminUser: admin
  # Google as an identity provider in the realm: the OAuth client (type "Web application", redirect URI
  # https://<keycloak host>/realms/<realm>/broker/google/endpoint). Its secret is in existingSecret.
  google:
    clientId: ""
  nodeSelector: {}
  resources:
    requests: {cpu: 100m, memory: 512Mi}
    limits: {memory: 1Gi}

# Keys and files for exports and imports (signing key, allowed_signers, deploy keys…), mounted at
# /etc/argus/portability when the Secret exists.
portabilitySecret: argus-portability

# Scheduled portability work (docs/operations.md), on the API's node (its volumes are ReadWriteOnce).
portabilityJobs:
  # Daily: removes archive files, quarantine, staging and evidence copies past the retention policy.
  cleanup:
    enabled: true
    schedule: "30 2 * * *"
  # Every 15 minutes: runs the periodic Git exports whose time has come (set on a published export, in
  # Administration → Portability). Nothing happens while no schedule is due.
  scheduled:
    enabled: true
    schedule: "*/15 * * * *"
  # Twice a year: restores the newest full export into a scratch database and records the result. Suspended
  # until the signing key, trusted keys, repository and one full export exist.
  restoreDrill:
    enabled: true
    suspend: true
    schedule: "0 3 1 1,7 *"
    repository: escrow

# The ledger's periodic work (docs/operations.md): ticket and review-queue escalation, e-mailing notifications,
# removing expired idempotency keys and unfinished uploads. On the API's node (its attachments volume).
ledgerJobs:
  escalate:
    enabled: true
    schedule: "*/10 * * * *"

# Notifications by e-mail. Off while host is empty: notifications stay in the app (the bell, the phone).
# The relay's account, when it needs one, is in the Secret named here (keys username and password), made by
# hand: kubectl -n argus create secret generic argus-smtp --from-literal=username=… --from-literal=password=…
email:
  host: ""
  port: 587
  security: starttls          # starttls, ssl (port 465) or none
  # The sender; empty: the account's address (username@ the server's domain, e.g. lnf.infn.it).
  from: ""
  secret: argus-smtp
  # Daily digests go out at this hour, Europe/Rome, to those who chose one.
  digestHour: 7

# Removing container images no container uses, on each node: every release pulls new ones, and the node
# disks are small. Kubernetes only collects images past ~85% full, too late for local-path volumes on the
# same disk. One CronJob per node (a pod runs on one node), with the node's root mounted to reach containerd.
imagePrune:
  enabled: false
  schedule: "0 4 */2 * *"        # every two days, 04:00; each further node 10 minutes later
  nodes: []                      # node names, e.g. [vnode-0, vnode-1, vnode-2]
  image: busybox:1.36
  # RKE2's crictl and containerd socket, as paths on the node.
  crictl: /var/lib/rancher/rke2/bin/crictl
  socket: unix:///run/k3s/containerd/containerd.sock
