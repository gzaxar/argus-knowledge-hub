# The INFN cloud cluster (kubectl --kubeconfig ~/kubeconfigs/cloud-config.txt), namespace argus.
# The image tags are set by the release workflow (.github/workflows/release.yml) on each version tag.
hosts:
  web: argus-hub.90.147.174.30.myip.cloud.infn.it
  api: argus-hub-api.90.147.174.30.myip.cloud.infn.it
  keycloak: keycloak.90.147.174.30.myip.cloud.infn.it

images:
  backend:
    tag: "1.35.53"
  web:
    tag: "1.35.53"
  # PostgreSQL 16 with pgvector and PostGIS (deploy/postgres): rehearsed on this installation's data with
  # tools/db-image-rehearsal on 2026-10-13 (every check passed but the administrator sign-in, not run). The
  # data directory is the same; going back is setting pgvector/pgvector:pg16-trixie again, until the GIS
  # release has created the PostGIS extension.
  postgres: ghcr.io/infn-argus/argus-knowledge-hub-postgres:1.35.24

# local-path volumes live on one node's disk and do not enforce their size: these are the room planned on
# each worker. vnode-0, the control plane, has under 2 GB free and takes none.
postgres:
  size: 10Gi
  nodeSelector:
    kubernetes.io/hostname: vnode-1
api:
  attachmentsSize: 15Gi
  portabilitySize: 5Gi
  nodeSelector:
    kubernetes.io/hostname: vnode-2
  # Google sign-in (Firebase), as before Keycloak, so existing accounts keep working.
  extraProviders:
    - issuer: https://securetoken.google.com/seraphic-camera-479521-s5
      jwks_uri: https://www.googleapis.com/service_accounts/v1/jwk/securetoken@system.gserviceaccount.com
      audience: seraphic-camera-479521-s5
  env:
    ARGUS_INSTANCE_NAME: argus-infn
    # Made administrators at their first sign-in (a new instance has none); later ones are granted in the app.
    ARGUS_BOOTSTRAP_ADMINS: andrea.michelotti@lnf.infn.it
    ARGUS_PORTABILITY_POLICY: trusted
    # The daily cleanup removes the files of finished exports and imports (archives, quarantine, staging
    # databases, evidence copies) after one day: the disks are small. Records, audit and Git history stay;
    # one still in progress is never touched.
    ARGUS_PORTABILITY_POLICY_RETENTION_DAYS: "1"
    # Administrators register repositories, trusted keys and the signing key in the web app
    # (Administration → Portability → Set-up). "off": only what this file and the Secret set.
    ARGUS_PORTABILITY_UI_CONFIG: "on"
web:
  nodeSelector:
    kubernetes.io/hostname: vnode-1
# Gmail, with an app password: Secret argus-smtp (keys username, password), created by hand, never in Git.
# Gmail sends as the account it signs in with, whatever From says: so From is that account.
email:
  host: smtp.gmail.com
  port: 587
  security: starttls
  from: michelottilabs@gmail.com
keycloak:
  # "Sign in with Google" on the Keycloak page (Google Cloud project seraphic-camera-479521-s5).
  google:
    clientId: 3066477772-1kgsiiv1akqfk266eia6spmod8o5ujjt.apps.googleusercontent.com
  nodeSelector:
    kubernetes.io/hostname: vnode-1
imagePrune:
  enabled: true
  nodes: [vnode-0, vnode-1, vnode-2]
