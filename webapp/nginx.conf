server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    # A redirect nginx makes itself names no host or port: behind the ingress, its own :8080 is nobody's address.
    absolute_redirect off;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # The built scripts and styles carry a hash in their names: a new release has new names, so these never
    # change and can be kept for good.
    # Only the built files (with an extension): a page under /assets/ is an application route, not a file.
    location ~ ^/assets/.+\.(js|css|svg|png|jpe?g|gif|webp|woff2?|ttf|map)$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # This installation's addresses (the Helm chart's web.runtimeConfig): read anew on every load.
    location = /config.js {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # The web app manifest (its icon is the ARGUS Field app's): nginx's types do not name it.
    location = /manifest.webmanifest {
        types { }
        default_type application/manifest+json;
        add_header Cache-Control "no-cache";
    }

    # The page itself is checked on every visit (a 304 when unchanged), so a release is seen at once
    # rather than whenever the browser's own guess expires.
    # No directory is ever a page: /assets is the Assets list, not the folder of built files (that folder's
    # $uri/ sent /assets to /assets/ and a 404).
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
