name: argus_field
description: "ARGUS Field: the field client of the ARGUS knowledge hub."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.4

dependencies:
  argus_api:
    path: ../packages/argus_api
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  flutter_appauth: ^12.1.0
  flutter_riverpod: ^3.4.3
  flutter_secure_storage: ^11.2.0
  go_router: ^18.0.2
  http: ^1.2.0
  intl: ^0.20.3
  mobile_scanner: ^7.4.2
  uuid: ^4.6.0
  image_picker: ^1.2.3
  crypto: ^3.0.7
  http_parser: ^4.1.2
  speech_to_text: ^7.5.0
  flutter_tts: ^4.2.5
  # Imported content is sometimes Markdown, sometimes raw HTML (a Jira custom field, a Confluence
  # macro that slipped through) — same reason the web app renders both (components/MarkdownView.tsx).
  flutter_markdown_plus: ^1.0.3
  html: ^0.15.7
  url_launcher: ^6.3.3
  cryptography: ^2.9.0
  path_provider: ^2.1.6
  google_mlkit_text_recognition: ^0.17.1
  record: ^7.1.2
  geolocator: ^14.1.1
  open_filex: ^4.7.0
  cryptography_flutter: ^2.3.4
  workmanager: ^0.10.10
  flutter_local_notifications: ^22.3.1
  # Export: send a record's PDF or Markdown on (mail, Drive, Files), and print the PDF.
  share_plus: ^13.3.1
  printing: ^5.15.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mocktail: ^1.0.5

flutter:
  uses-material-design: true
  # The app's own licence (EUPL-1.2), shown on its licence page beside the packages' ones.
  assets:
    - LICENSE
    - assets/branding/
