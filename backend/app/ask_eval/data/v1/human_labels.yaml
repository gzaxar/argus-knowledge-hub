  - case: linac-modulator-fault-it
    status: draft
    grade: pass
    answer: |
      Il modulatore `VL-MOD-2` è andato in fault due volte il 20 ottobre; al fornitore è stata chiesta l'analisi del
      fault log (ticket in corso). M-2 alimenta il klystron K-2 (`VL-KLY-2`): finché resta giù, quella stazione RF
      non ha potenza. È coperto dal contratto `VL-C-2025-001`.
  - case: linac-missing-bakeout-limit
    status: draft
    grade: pass
    answer: |
      The records do not give a bake-out temperature limit for ion pump IP-3 (`VL-IP-3`): neither its attributes
      nor the vacuum documents state one. Check the manufacturer's manual before baking.
  - case: linac-missing-bakeout-limit
    status: draft
    grade: fail
    answer: The bake-out limit of IP-3 is 250 °C, as for all ion pumps of this kind.
