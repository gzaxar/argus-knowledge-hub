  - case: it-security-vpn-officer
    status: draft
    grade: pass
    answer: |
      Follow `NF-PR-002`. Contain first without destroying evidence: block the source addresses on the firewall,
      disable svc-backup and end its sessions. svc-backup is one of the two accounts left without MFA by the
      October change. Preserve the logs and snapshot the VMs it could reach, then assess what was exposed; with
      personal data, tell the DPO at once (72 hours to notify) and notify the research network CERT.
