# The object types of an accelerator facility, on the shared backbone of core-objects and it (docs/asset-schema-design.md is the reasoning).
# One abstract root and six branches: Functional (what the machine is), Physical (the serialised boxes),
# Catalogue (products and vendors), Control (EPIK8s), Engineering records, Location; plus IT records and
# ports. Types under the beamline roots belong to one machine; everything else is shared by every
# workspace (the catalogue workspace flags them global).
#
# Never rename a type, an attribute key or an option id here: stored records use them. A type's uid in a
# workspace is <workspace>:argus-object:<name as a slug>.

option_sets:
  band:
    - {id: s_band, value: S-band}
    - {id: c_band, value: C-band}
    - {id: x_band, value: X-band}
  pickup_kind:
    - {id: button, value: Button}
    - {id: stripline, value: Stripline}
    - {id: cavity, value: Cavity}
    - {id: inductive, value: Inductive}

object_types:
  beamline_roots: [Functional Element, Control Item, Engineering Record]
  types:
    - name: "Functional Element"
      parent: "Engineered Item"
      description: "What the machine is made of, and where along the beam."
      abstract: true
      icon: tabler/hierarchy-2
      behaviors: [functional]
      attributes:
        - {key: argus_beamline, name: Beamline, indexed: true}
        - {key: zone, name: Zones, indexed: true, multi: true}
    - name: "Facility"
      parent: "Functional Element"
      description: "A beamline or accelerator facility."
      icon: tabler/building-factory-2
      attributes:
        - {key: beamline, name: Beamline (as configured), indexed: true}
        - {key: namespace, name: Kubernetes namespace, indexed: true}
        - {key: cluster, name: Cluster, indexed: true}
        - {key: git_url, name: Repository, indexed: true}
        - {key: git_revision, name: Revision}
    - name: "Section"
      parent: "Functional Element"
      description: "Injector, linac, bunch compressor, undulator hall."
      icon: tabler/section
    - name: "Machine System"
      parent: "Functional Element"
      description: "A named system: Vacuum, RF, Magnets, Diagnostics."
      icon: tabler/sitemap
      attributes:
        - {key: system_code, name: System code, indexed: true}
        - {key: responsible_group, name: Responsible group}
    - name: "Machine Module"
      parent: "Functional Element"
      description: "An assembled module, as the PBS names them."
      icon: tabler/puzzle
      attributes:
        - {key: module_code, name: Module, indexed: true, unique: true}
        - {key: module_kind, name: Module kind, type: enumeration, options: [{id: accelerating, value: Accelerating}, {id: magnetic, value: Magnetic}, {id: diagnostic, value: Diagnostic}, {id: plasma, value: Plasma}, {id: other, value: Other}]}
        - {key: assembly_state, name: Assembly state, type: enumeration, options: [{id: designed, value: Designed}, {id: in_assembly, value: In assembly}, {id: assembled, value: Assembled}, {id: installed, value: Installed}]}
    - name: "RF Station"
      parent: "Functional Element"
      description: "Modulator, amplifier, compressor, waveguide and structures that make one RF source."
      icon: tabler/antenna-bars-5
      attributes:
        - {key: band, name: Band, type: enumeration, option_set: band}
        - {key: station_number, name: Station number, type: integer}
        - {key: frequency, name: Frequency (MHz), type: float}
        - {key: peak_power, name: Peak power (MW), type: float}
        - {key: pulse_length, name: Pulse length (µs), type: float}
        - {key: repetition_rate, name: Repetition rate (Hz), type: float}
    - name: "Beam Element"
      parent: "Functional Element"
      description: "Something the beam passes through or is acted on by."
      abstract: true
      icon: tabler/arrow-narrow-right
      attributes:
        - {key: lattice_name, name: Lattice name, indexed: true, unique: true, regex: '^[A-Z][A-Z0-9_]{2,15}$'}
        - {key: s_position, name: s position (m), type: float}
        - {key: length, name: Magnetic/effective length (m), type: float}
        - {key: family, name: Family, indexed: true}
        - {key: design_value, name: Design strength, type: float}
        - {key: design_unit, name: Design strength unit, indexed: true}
        - {key: polarity, name: Polarity, type: enumeration, options: [{id: positive, value: Positive}, {id: negative, value: Negative}, {id: bipolar, value: Bipolar}]}
        - {key: model_name, name: Model name, indexed: true}
        - {key: element_kind, name: Element kind, indexed: true}
        - {key: capabilities, name: Capabilities, indexed: true, multi: true}
        - {key: native_type, name: Native type, indexed: true}
        - {key: native_source, name: Native source, indexed: true}
        - {key: component_family, name: Component family, indexed: true}
        - {key: definition, name: Definition, indexed: true}
        - {key: aliases, name: Aliases, indexed: true, multi: true}
        - {key: virtual, name: Virtual (no physical object), type: boolean}
    - name: "Dipole"
      parent: "Beam Element"
      description: "A bending magnet."
      icon: argus/dipole-magnet
      attributes:
        - {key: bend_angle, name: Bend angle (rad), type: float}
        - {key: bend_radius, name: Bend radius (m), type: float}
        - {key: field, name: Field (T), type: float}
    - name: "Quadrupole"
      parent: "Beam Element"
      description: "A focusing magnet."
      icon: argus/quadrupole
      attributes:
        - {key: gradient, name: Gradient (T/m), type: float}
        - {key: k1, name: k1 (1/m²), type: float}
        - {key: aperture_radius, name: Aperture radius (mm), type: float}
    - name: "Sextupole"
      parent: "Beam Element"
      description: "A chromaticity-correcting magnet."
      icon: tabler/hexagon
      attributes:
        - {key: k2, name: k2 (1/m³), type: float}
    - name: "Corrector"
      parent: "Beam Element"
      description: "A steering magnet."
      icon: argus/dipole-magnet
      attributes:
        - {key: plane, name: Plane, type: enumeration, options: [{id: h, value: H}, {id: v, value: V}, {id: combined, value: Combined}]}
        - {key: max_kick, name: Maximum kick (mrad), type: float}
    - name: "Solenoid"
      parent: "Beam Element"
      description: "A solenoid magnet."
      icon: tabler/spiral
      attributes:
        - {key: field_on_axis, name: Field on axis (T), type: float}
    - name: "Accelerating Structure"
      parent: "Beam Element"
      description: "A travelling- or standing-wave structure."
      icon: tabler/wave-sine
      attributes:
        - {key: frequency, name: Frequency (MHz), type: float}
        - {key: n_cells, name: Number of cells, type: integer}
        - {key: gradient, name: Gradient (MV/m), type: float}
        - {key: r_over_q, name: R/Q (Ω), type: float}
        - {key: q0, name: Unloaded Q, type: float}
    - name: "RF Gun"
      parent: "Beam Element"
      description: "The electron source."
      icon: tabler/atom
      attributes:
        - {key: frequency, name: Frequency (MHz), type: float}
        - {key: cathode_material, name: Cathode material, indexed: true}
        - {key: peak_field, name: Peak field (MV/m), type: float}
    - name: "RF Deflector"
      parent: "Beam Element"
      description: "A transverse deflecting cavity."
      icon: tabler/arrow-bear-right
    - name: "Undulator"
      parent: "Beam Element"
      description: "A periodic magnet array producing radiation."
      icon: tabler/wave-square
      attributes:
        - {key: period, name: Period (mm), type: float}
        - {key: n_periods, name: Number of periods, type: integer}
        - {key: k_value, name: K value, type: float}
        - {key: gap_min, name: Minimum gap (mm), type: float}
        - {key: gap_max, name: Maximum gap (mm), type: float}
    - name: "Plasma Module"
      parent: "Beam Element"
      description: "A plasma-accelerator stage."
      icon: tabler/atom-2
      attributes:
        - {key: capillary_length, name: Capillary length (mm), type: float}
        - {key: capillary_diameter, name: Capillary diameter (mm), type: float}
        - {key: gas, name: Gas, indexed: true}
        - {key: discharge_voltage, name: Discharge voltage (kV), type: float}
        - {key: plasma_density, name: Plasma density (cm⁻³), type: float}
    - name: "Collimator"
      parent: "Beam Element"
      description: "An aperture limiting the beam."
      icon: tabler/focus-centered
      attributes:
        - {key: aperture_min, name: Aperture minimum (mm), type: float}
        - {key: aperture_max, name: Aperture maximum (mm), type: float}
        - {key: material, name: Material, indexed: true}
    - name: "Beam Stopper"
      parent: "Beam Element"
      description: "Blocks the beam."
      icon: tabler/hand-stop
      attributes:
        - {key: aperture_min, name: Aperture minimum (mm), type: float}
        - {key: aperture_max, name: Aperture maximum (mm), type: float}
        - {key: material, name: Material, indexed: true}
    - name: "Mirror"
      parent: "Beam Element"
      description: "A mirror steering a laser beam, on a mount that motors tilt."
      icon: tabler/flip-horizontal
      attributes:
        - {key: mirror_kind, name: Mirror kind, type: enumeration, options: [{id: flat, value: Flat}, {id: parabolic, value: Parabolic}, {id: other, value: Other}]}
        - {key: beam, name: Laser line, indexed: true}
        - {key: coating, name: Coating, indexed: true}
        - {key: diameter_mm, name: Diameter (mm), type: float}
        - {key: substrate, name: Substrate, indexed: true}
    - name: "Vacuum Sector"
      parent: "Beam Element"
      description: "What a valve isolates."
      icon: tabler/brackets-contain
      attributes:
        - {key: nominal_pressure, name: Nominal pressure (mbar), type: float}
        - {key: length, name: Length (m), type: float}
        - {key: isolated_by, name: Isolated by, type: reference, multi: true, reference: Vacuum Valve}
    - name: "Diagnostic Element"
      parent: "Beam Element"
      description: "Measures the beam."
      abstract: true
      icon: tabler/chart-line
      attributes:
        - {key: measures, name: Measures, type: enumeration, options: [{id: position, value: Position}, {id: charge, value: Charge}, {id: profile, value: Profile}, {id: emittance, value: Emittance}, {id: energy, value: Energy}, {id: arrival_time, value: Arrival time}, {id: bunch_length, value: Bunch length}, {id: loss, value: Loss}]}
        - {key: is_invasive, name: Stops the beam, type: boolean}
        - {key: resolution, name: Resolution, type: float}
        - {key: resolution_unit, name: Resolution unit, indexed: true}
        - {key: acquisition_rate, name: Acquisition rate (Hz), type: float}
        - {key: calibration_due, name: Calibration due, type: date}
    - name: "Screen Station"
      parent: "Diagnostic Element"
      description: "A screen, camera, actuator and optics composed into one profile monitor."
      icon: tabler/aperture
      attributes:
        - {key: screen_type, name: Screen type, type: enumeration, options: [{id: yag_ce, value: 'YAG:Ce'}, {id: lyso, value: LYSO}, {id: otr, value: OTR}, {id: chromox, value: Chromox}, {id: scintillating_fibre, value: Scintillating fibre}]}
        - {key: calibration_um_per_px, name: Calibration (µm/px), type: float}
        - {key: insertion_positions, name: Insertion positions, indexed: true, multi: true}
        - {key: viewing_angle_deg, name: Viewing angle (°), type: float}
        - {key: field_of_view_mm, name: Field of view (mm), type: float}
    - name: "Beam Position Monitor"
      parent: "Diagnostic Element"
      description: "Measures the beam's transverse position."
      icon: tabler/crosshair
      attributes:
        - {key: pickup_kind, name: Pickup, type: enumeration, option_set: pickup_kind}
        - {key: n_electrodes, name: Number of electrodes, type: integer}
        - {key: bandwidth, name: Bandwidth (MHz), type: float}
    - name: "Beam Charge Monitor"
      parent: "Diagnostic Element"
      description: "Measures the bunch charge."
      icon: tabler/chart-donut
      attributes:
        - {key: monitor_kind, name: Monitor kind, type: enumeration, options: [{id: integrating_current_transformer, value: Integrating current transformer}, {id: wall_current, value: Wall current}, {id: faraday_cup, value: Faraday cup}]}
        - {key: charge_range_pc, name: Charge range (pC), type: float}
    - name: "Faraday Cup"
      parent: "Diagnostic Element"
      description: "Stops the beam and reads its charge."
      icon: tabler/cup
      attributes:
        - {key: material, name: Material, indexed: true}
        - {key: is_retractable, name: Retractable, type: boolean}
    - name: "Wire Scanner"
      parent: "Diagnostic Element"
      description: "Profiles the beam with a moving wire."
      icon: tabler/scan
      attributes:
        - {key: wire_material, name: Wire material, indexed: true}
        - {key: wire_diameter, name: Wire diameter (µm), type: float}
        - {key: n_planes, name: Number of planes, type: integer}
    - name: "Emittance Meter"
      parent: "Diagnostic Element"
      description: "Measures emittance; composed of screens and actuators."
      icon: tabler/chart-scatter
      attributes:
        - {key: method, name: Method, type: enumeration, options: [{id: pepper_pot, value: Pepper-pot}, {id: quadrupole_scan, value: Quadrupole scan}, {id: multi_screen, value: Multi-screen}, {id: slit_scan, value: Slit-scan}]}
        - {key: mask_pitch, name: Mask pitch (µm), type: float}
    - name: "Spectrometer Station"
      parent: "Diagnostic Element"
      description: "Measures the beam's energy spectrum."
      icon: tabler/prism
      attributes:
        - {key: dispersion, name: Dispersion (m), type: float}
        - {key: energy_range_min, name: Energy range minimum (MeV), type: float}
        - {key: energy_range_max, name: Energy range maximum (MeV), type: float}
    - name: "Beam Loss Monitor"
      parent: "Diagnostic Element"
      description: "Detects lost particles."
      icon: tabler/alert-triangle
      attributes:
        - {key: detector_kind, name: Detector, type: enumeration, options: [{id: ion_chamber, value: Ion chamber}, {id: scintillator, value: Scintillator}, {id: cherenkov, value: Cherenkov}, {id: pin_diode, value: PIN diode}]}
        - {key: alarm_threshold, name: Alarm threshold, type: float}
    - name: "Beam Arrival Monitor"
      parent: "Diagnostic Element"
      description: "Measures arrival time."
      icon: tabler/clock
      attributes:
        - {key: time_resolution_fs, name: Time resolution (fs), type: float}
        - {key: pickup_kind, name: Pickup, type: enumeration, option_set: pickup_kind}
    - name: "Bunch Length Monitor"
      parent: "Diagnostic Element"
      description: "Measures the bunch length."
      icon: tabler/ruler-measure
      attributes:
        - {key: method, name: Method, type: enumeration, options: [{id: electro_optic_sampling, value: Electro-optic sampling}, {id: streak_camera, value: Streak camera}, {id: ctr, value: CTR}, {id: cdr, value: CDR}, {id: rf_deflector, value: RF deflector}]}
        - {key: time_range_ps, name: Time range (ps), type: float}
    - name: "Generic Monitor"
      parent: "Diagnostic Element"
      description: "A diagnostic location a model names without saying what kind: a particle monitor, a photodiode, a camera on a laser line."
      icon: tabler/device-analytics
    - name: "Drift"
      parent: "Beam Element"
      description: "A field-free length between elements."
      icon: tabler/line-dashed
    - name: "Kicker"
      parent: "Beam Element"
      description: "A fast pulsed magnet for injection or extraction."
      icon: tabler/arrow-bear-right
      attributes:
        - {key: plane, name: Plane, type: enumeration, options: [{id: h, value: H}, {id: v, value: V}]}
        - {key: max_kick, name: Maximum kick (mrad), type: float}
    - name: "Septum"
      parent: "Beam Element"
      description: "Separates two beam paths: where a line branches off or joins."
      icon: tabler/arrows-join
      attributes:
        - {key: septum_kind, name: Septum kind, type: enumeration, options: [{id: magnetic, value: Magnetic}, {id: electrostatic, value: Electrostatic}, {id: lambertson, value: Lambertson}]}
    - name: "RF Cavity"
      parent: "Beam Element"
      description: "A cavity giving the beam energy or bunching it, in a ring or a linac."
      icon: tabler/wave-sine
      attributes:
        - {key: frequency, name: Frequency (MHz), type: float}
        - {key: harmonic, name: Harmonic number, type: integer}
    - name: "Beam Source"
      parent: "Beam Element"
      description: "Where a beam starts: an electron gun, an ion source, a laser oscillator."
      icon: tabler/flare
    - name: "Beam Dump"
      parent: "Beam Element"
      description: "Where a beam ends: absorbed for good."
      icon: tabler/cylinder
      attributes:
        - {key: material, name: Material, indexed: true}
    - name: "Lens"
      parent: "Beam Element"
      description: "Focuses a photon beam."
      icon: tabler/focus-centered
      attributes:
        - {key: focal_length, name: Focal length (m), type: float}
    - name: "Beam Splitter"
      parent: "Beam Element"
      description: "Divides a photon beam between two paths."
      icon: tabler/prism
      attributes:
        - {key: split_ratio, name: Split ratio, type: float}
    - name: "Generic Beam Element"
      parent: "Beam Element"
      description: "An element a model has and this catalogue has no kind for; its native type says what it is."
      icon: tabler/box
    - name: "Vacuum Element"
      parent: "Beam Element"
      description: "A vacuum component in the beam path: beam pipe, chamber, bellows, flange, transition, valve, window, pumping or gauge port. Its kind is the element kind."
    - name: "Material Element"
      parent: "Beam Element"
      description: "Material the beam meets: a foil, window, wire, target, converter, gas target or crystal."
      attributes:
        - {key: material, name: Material, indexed: true}
        - {key: thickness, name: Thickness (m), type: float}
    - name: "Optical Element"
      parent: "Beam Element"
      description: "An optical component of a photon line other than a mirror, lens or beam splitter: polariser, waveplate, grating, prism, iris, filter, amplifier."
    - name: "Support Element"
      parent: "Beam Element"
      description: "A girder, support, mover, stage, fiducial or alignment reference: it carries or locates beamline components, without necessarily being in the beam."
    - name: "Beam System"
      parent: "Functional Element"
      description: "A system that produces or transports a beam: a storage ring, an accumulator, a linac, a transfer line, a laser transport, an FEL line."
      aliases: [beam system, accelerator, beamline system]
      icon: tabler/atom
      attributes:
        - {key: system_kind, name: System kind, type: enumeration, options: [{id: storage_ring, value: Storage ring}, {id: synchrotron, value: Synchrotron}, {id: accumulator, value: Accumulator}, {id: linac, value: Linac}, {id: transfer_line, value: Transfer line}, {id: laser_transport, value: Laser transport}, {id: fel_line, value: FEL line}, {id: other, value: Other}]}
        - {key: model_id, name: Model id, indexed: true}
        - {key: model_name, name: Model name}
        - {key: model_source, name: Model source, indexed: true}
        - {key: model_version, name: Model version}
        - {key: model_git_commit, name: Model git commit}
        - {key: model_simulator, name: Model simulator, indexed: true}
    - name: "Beam"
      parent: "Functional Element"
      description: "What a beam system carries: the reference beam, separately from the topology it travels."
      abstract: true
      icon: tabler/atom-2
      attributes:
        - {key: model_id, name: Model id, indexed: true}
    - name: "Particle Beam"
      parent: "Beam"
      description: "A beam of charged (or neutral) particles."
      attributes:
        - {key: species, name: Species, indexed: true}
        - {key: charge, name: Charge (e), type: float}
        - {key: reference_energy, name: Reference energy (GeV), type: float}
        - {key: reference_momentum, name: Reference momentum (GeV/c), type: float}
        - {key: rest_mass, name: Rest mass (MeV/c²), type: float}
    - name: "Photon Beam"
      parent: "Beam"
      description: "A photon beam: a laser, or radiation transported to an experiment."
      icon: tabler/sun
      attributes:
        - {key: wavelength, name: Wavelength (nm), type: float}
        - {key: frequency, name: Frequency (THz), type: float}
        - {key: pulse_duration, name: Pulse duration (fs), type: float}
        - {key: repetition_rate, name: Repetition rate (Hz), type: float}
        - {key: polarization, name: Polarization, indexed: true}
    - name: "Beam Path"
      parent: "Functional Element"
      description: "The route a beam takes: open (a linac, a transfer line, a laser line) or closed (a ring). Its elements are joined by `upstream of`, its branches by `branches to`, and a closed path's last element by `closes to` its first; `s` is a coordinate along it, not its topology."
      icon: tabler/route
      attributes:
        - {key: topology, name: Topology, type: enumeration, options: [{id: open, value: open}, {id: closed, value: closed}]}
        - {key: length, name: Length or circumference (m), type: float}
        - {key: direction, name: Direction, type: enumeration, options: [{id: forward, value: forward}, {id: backward, value: backward}]}
        - {key: model_id, name: Model id, indexed: true}
        - {key: sequence, name: Placement order, multi: true}
    - name: "Power Supply"
      parent: "Asset"
      description: "Powers a magnet or another load."
      icon: tabler/bolt
      attributes:
        - {key: n_channels, name: Number of channels, type: integer}
        - {key: current_max, name: Maximum current (A), type: float}
        - {key: voltage_max, name: Maximum voltage (V), type: float}
        - {key: bipolar, name: Bipolar, type: boolean}
        - {key: interface, name: Interface, type: enumeration, options: [{id: modbus_tcp, value: Modbus TCP}, {id: serial, value: Serial}, {id: ethernet, value: Ethernet}, {id: gpib, value: GPIB}, {id: can, value: CAN}]}
        - {key: ramp_rate, name: Ramp rate (A/s), type: float}
    - name: "Magnet Assembly"
      parent: "Asset"
      description: "The magnet itself, as a physical unit."
      icon: argus/dipole-magnet
      attributes:
        - {key: coil_resistance, name: Coil resistance (Ω), type: float}
        - {key: cooling, name: Cooling, type: enumeration, options: [{id: air, value: Air}, {id: water, value: Water}, {id: cryogenic, value: Cryogenic}]}
        - {key: weight, name: Weight (kg), type: float}
    - name: "RF Amplifier"
      parent: "Asset"
      description: "Klystron or solid-state amplifier."
      icon: tabler/antenna
    - name: "Klystron"
      parent: "RF Amplifier"
      description: "A klystron: the vacuum-tube amplifier itself, beam in, RF out."
      attributes:
        - {key: frequency_mhz, name: Frequency (MHz), type: float}
        - {key: peak_power_mw, name: Peak power (MW), type: float}
        - {key: beam_voltage_kv, name: Beam voltage (kV), type: float}
        - {key: n_cavities, name: Number of cavities, type: integer}
    - name: "Collector"
      parent: "Asset"
      description: "A klystron's collector: the sub-component housed inside it that absorbs the spent electron beam once it has given up its energy to the RF cavities."
      aliases: [beam collector, electron collector]
      attributes:
        - {key: cooling, name: Cooling, type: enumeration, options: [{id: air, value: Air}, {id: water, value: Water}]}
        - {key: dissipation_max_kw, name: Maximum dissipation (kW), type: float}
        - {key: is_depressed, name: Depressed (multi-stage), type: boolean}
    - name: "Modulator"
      parent: "Asset"
      description: "Pulsed power for a klystron."
      icon: tabler/wave-saw-tool
    - name: "Low-Level RF Unit"
      parent: "Asset"
      description: "Regulates RF phase and amplitude."
      icon: tabler/cpu
    - name: "Waveguide Component"
      parent: "Asset"
      description: "A part of the RF waveguide network."
      abstract: true
      icon: tabler/arrows-right-left
      attributes:
        - {key: band, name: Band, type: enumeration, option_set: band}
        - {key: waveguide_size, name: Waveguide size, indexed: true}
        - {key: flange_type, name: Flange type}
        - {key: peak_power_rating, name: Peak power rating (MW), type: float}
        - {key: average_power_rating, name: Average power rating (kW), type: float}
        - {key: is_pressurised, name: Pressurised, type: boolean}
        - {key: gas, name: Gas, indexed: true}
    - name: "Waveguide Section"
      parent: "Waveguide Component"
      description: "A straight or bent length of waveguide."
      attributes:
        - {key: length_mm, name: Length (mm), type: float}
        - {key: bend_angle_deg, name: Bend angle (°), type: float}
        - {key: is_flexible, name: Flexible, type: boolean}
    - name: "RF Load"
      parent: "Waveguide Component"
      description: "Absorbs RF power."
      attributes:
        - {key: load_kind, name: Load kind, type: enumeration, options: [{id: water, value: Water}, {id: dry, value: Dry}, {id: ceramic, value: Ceramic}]}
