# The catalogue's sources, pinned (docs/catalogue-collections.md §A, app/catalogue/sources.py).
# ARGUS reads each repository at exactly `commit`; a release tag must still point at it. Changing a pin is a
# reviewed pull request: preview the new release on Administration › Catalogue before installing it.
sources:
  - id: argus
    kind: argus-collections
    repo: https://github.com/infn-argus/argus-catalogue.git
    ref: v0.2.0
    commit: c0121da62ac81f019e5e7e187d2da8bc0ff6295a

  - id: netbox
    kind: netbox-devicetype-library
    repo: https://github.com/infn-argus/devicetype-library.git
    ref: infn
    commit: 25e998f1aa57e9c7c7457c6de2b0d9bd2282e959
    # device-types/<Manufacturer>/<file without .yaml>: the IT devices INFN uses.
    select:
      - Moxa/NPort-5250A
      - Moxa/NPort-5410
      - Moxa/NPort-5450
      - Moxa/NPort-5650-8
      - Moxa/NPort-5650-16
      - Basler/a2A1920-51gmBAS
      - Basler/a2A2600-20gmBAS
      - Basler/scA640-70gm
    collection:
      id: it-devices
      version: 0.1.1
      name: IT devices (NetBox Device Type Library)
      domain: it
      requires:
        packages: {core-objects: ">=2.1,<3", it: ">=1.1,<2", accelerator: ">=1.0"}
        collections: {vendors: ">=0.2,<1"}
