# A self-contained ARGUS Knowledge Hub for local use: database, API and web UI.
#
#   docker compose up -d --build --wait
#   docker compose exec api python scripts/create_token.py dev "Local development" local
#
# The second command prints an API token once. Open http://localhost:5173, give
# the API address http://localhost:8080 (plain http: the API does not speak
# TLS) and that token.
#
# Everything here is for one developer's machine. The pepper and the secrets key
# below are public defaults; never reuse them anywhere that holds real data.
#
# Ports are overridable when something else already holds them, e.g. a dev
# server started by hand:   API_PORT=18080 WEB_PORT=15173 docker compose up -d
#
# State lives in two named volumes and survives "docker compose down"; add -v to
# throw it away:   docker compose down -v
#
# A local Keycloak stands in for a real OIDC provider (production points the
# same three env vars at INFN's own, GODiVA-fed one instead), for testing a
# person who can hold different roles in more than one workspace — a PAT
# never can, by design. See docs/oidc-dev-setup.md: what it does and doesn't
# simulate, the six test users it seeds, and how to fetch each one a token.
#
#   docker compose up -d --build --wait
#   docker compose exec api python scripts/seed_dev_users.py

name: argus-knowledge-hub

services:
  db:
    # Postgres 16 with pgvector (Ask ARGUS's semantic search) and PostGIS (the spatial model): deploy/postgres.
    build: ./deploy/postgres
    image: argus-knowledge-hub-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: app
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d app"]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    build: ./backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/app
      # Mixed into every token hash. Tokens minted under one pepper are not
      # accepted under another, so changing it logs everybody out.
      TOKEN_PEPPER: ${TOKEN_PEPPER:-dev-only}
      # Encrypts import credentials at rest. Only needed if you store a token in
      # a saved import configuration.
      IMPORT_SECRETS_KEY: ${IMPORT_SECRETS_KEY:-yADxm1nk5JiTglldbDr6z-QsCFvuKVnRO-UVZgarSdc=}
      ATTACHMENTS_DIR: /data/attachments
      # Points at the local Keycloak below. A PAT is checked first and still
      # works with none of this running (see auth.py get_identity); these only
      # matter once a bearer token isn't a known PAT. Swapping in INFN's real
      # GODiVA-fed Keycloak later is changing these three values, nothing else.
      OIDC_ISSUER: http://localhost:${KEYCLOAK_PORT:-8081}/realms/argus-dev
      OIDC_JWKS_URI: http://keycloak:8080/realms/argus-dev/protocol/openid-connect/certs
      OIDC_AUDIENCE: argus-webapp
      # The development realm's administrator, so a fresh local hub has someone who can manage it
      # (the other test users get their access from scripts/seed_dev_users.py).
      ARGUS_BOOTSTRAP_ADMINS: ${ARGUS_BOOTSTRAP_ADMINS:-admin.test@argus.test}
      # Portable exports (docs/operations.md). Development values: `python -m app.portability dev-setup`
      # creates a throwaway signing key, a local bare repository and an artifact store under the volume.
      ARGUS_PORTABILITY_ROOT: /data/portability
      ARGUS_PORTABILITY_REPOSITORIES: escrow-dev=/data/portability/dev/escrow.git
      ARGUS_PORTABILITY_ARTIFACT_STORES: vault-dev=/data/portability/dev/artifacts
      ARGUS_PORTABILITY_SIGNING_KEY: /data/portability/dev/signing_key
      ARGUS_PORTABILITY_TRUSTED_KEYS: /data/portability/dev/allowed_signers
      ARGUS_INSTANCE_NAME: argus-dev
    volumes:
      - attachments:/data/attachments
      - portability:/data/portability
    ports:
      - "${API_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health')"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s

  web:
    build:
      context: ./webapp
      # The browser talks to Keycloak and to the API by the addresses published
      # on this machine, not by the compose-network names the containers use.
      args:
        VITE_OIDC_AUTHORITY: http://localhost:${KEYCLOAK_PORT:-8081}/realms/argus-dev
        VITE_OIDC_CLIENT_ID: argus-webapp
        VITE_OIDC_LABEL: INFN login
        VITE_API_BASE_URL: http://localhost:${API_PORT:-8080}
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${WEB_PORT:-5173}:8080"

  # A stand-in identity provider, not part of the default "docker compose up"
  # story for anyone who only wants PAT logins — nothing above requires it to
  # be running. KC_HOSTNAME pins the issuer to one fixed URL regardless of
  # whether a request reaches it as "keycloak:8080" (from inside this compose
  # network) or "localhost:8081" (from the host or a browser); without that,
  # the two paths mint tokens with two different `iss` claims and only one of
  # them would ever verify.
  keycloak:
    image: quay.io/keycloak/keycloak:24.0.5
    command: start-dev --import-realm
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      # A bare hostname, not a URL: this build's hostname provider (v24) takes
      # KC_HOSTNAME + KC_HOSTNAME_PORT separately and composes the URL itself;
      # handing it a scheme produces a mangled issuer ("http://http//...").
      KC_HOSTNAME: localhost
      KC_HOSTNAME_PORT: ${KEYCLOAK_PORT:-8081}
      KC_HOSTNAME_STRICT_HTTPS: "false"
      KC_HEALTH_ENABLED: "true"
    volumes:
      - ./keycloak:/opt/keycloak/data/import:ro
    ports:
      - "${KEYCLOAK_PORT:-8081}:8080"
    healthcheck:
      # This build (24.0.5) serves /health on the main port; the separate
      # management port is a later version's default, not this one's.
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/localhost/8080 && printf 'GET /health/ready HTTP/1.1\\r\\nhost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q '\"status\": \"UP\"' <&3"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

volumes:
  portability:
  pgdata:
  attachments:
